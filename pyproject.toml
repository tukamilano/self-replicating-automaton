[project]
name = "vn-automaton"
version = "0.1.0"
description = "フォン・ノイマンの自己複製オートマトンを動かして理解する"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "matplotlib>=3.7"]

[project.optional-dependencies]
dev = ["pytest>=7"]

[tool.setuptools.packages.find]
include = ["vn*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
